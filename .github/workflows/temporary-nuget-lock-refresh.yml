# Temporary one-shot workflow: regenerate NuGet lock files, then delete itself.
name: temporary-nuget-lock-refresh
on:
  push:
    branches:
      - chore/consolidate-deps-61-62

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/consolidate-deps-61-62
          persist-credentials: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Rebuild all NuGet lock files
        run: dotnet restore ./WebApiCoreSeed.slnx --force-evaluate
      - name: Commit updated lock files and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- src tests tools
          git rm .github/workflows/temporary-nuget-lock-refresh.yml
          git diff --cached --stat
          git commit -m "chore(deps): regenerate NuGet lock files for supported .NET 10 packages"
          git push origin HEAD:refs/heads/chore/consolidate-deps-61-62
