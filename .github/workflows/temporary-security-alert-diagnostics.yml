# Temporary diagnostics workflow. Remove after collecting the requested alert details.
name: Temporary Code Scanning Alert Diagnostics
on:
  push:
    branches:
      - fix/code-scanning-cache-isolation
    paths:
      - .github/workflows/temporary-security-alert-diagnostics.yml

permissions:
  contents: read
  security-events: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read selected CodeQL alert metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for number in 10 11 12 13 14; do
            file="$(mktemp)"
            code="$(curl --silent --show-error --location --output "$file" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPOSITORY}/code-scanning/alerts/${number}")"
            if [[ "$code" != 200 ]]; then
              echo "ALERT #$number HTTP $code (read permission may be unavailable)"
              rm -f "$file"
              continue
            fi
            jq -c '{number, state, created_at, fixed_at, rule: {id: .rule.id, description: .rule.description, severity: .rule.severity, security_severity_level: .rule.security_severity_level}, location: .most_recent_instance.location, message: .most_recent_instance.message.text}' "$file"
            rm -f "$file"
          done
