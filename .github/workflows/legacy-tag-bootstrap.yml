# One-time archival operation; remove from PR after the tag has been verified.
name: Bootstrap historical legacy tag

on:
  push:
    branches:
      - phase/1-preserve-legacy
    paths:
      - .github/workflows/legacy-tag-bootstrap.yml

permissions:
  contents: write

jobs:
  create-historical-ref:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Create or verify exact legacy source tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LEGACY_SHA: 6ce03d7f011c6809fbcbad47aa26d490f53ddf3d
          TAG_NAME: v1.0.0-legacy
        shell: bash
        run: |
          set -euo pipefail
          # Resolve historical source SHA directly, without checking out or rebuilding
          # unsupported dependencies. Do not move or replace a pre-existing tag.
          existing_json="$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG_NAME}" 2>/dev/null || true)"
          existing="$(jq -r '.object.sha // empty' <<< "${existing_json}")"
          if [[ -n "${existing}" ]]; then
            if [[ "${existing}" != "${LEGACY_SHA}" ]]; then
              echo "::error::Existing tag ${TAG_NAME} points to unexpected commit ${existing}"
              exit 1
            fi
            echo "Historical tag already exists at expected SHA"
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              --field ref="refs/tags/${TAG_NAME}" \
              --field sha="${LEGACY_SHA}" --silent
            echo "Created historical tag ${TAG_NAME}"
          fi
          actual="$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')"
          test "${actual}" = "${LEGACY_SHA}"
          echo "Verified refs/tags/${TAG_NAME} -> ${actual}"
